name: Daily Event Ingest

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      event_urls:
        description: "Optional comma-separated disneyevent.com URLs for a focused smoke test"
        required: false
        type: string
      price_collection_limit:
        description: "Maximum number of events to attempt Browserless ticket pricing for"
        required: false
        default: "5"
        type: string
      force_price_refresh:
        description: "Retry ticket pricing even if a recent collected/failed result exists"
        required: false
        default: false
        type: boolean
      pricing_refresh_scope:
        description: "Which events should get Browserless ticket pricing attempts"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - missing-stale-failed

concurrency:
  group: daily-event-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production event ingest
        env:
          ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          SITE_BYPASS_TOKEN: ${{ secrets.SITE_BYPASS_TOKEN }}
          TICKET_PRICE_COLLECTOR_ENDPOINT: ${{ vars.TICKET_PRICE_COLLECTOR_ENDPOINT }}
          TICKET_PRICE_COLLECTOR_TOKEN: ${{ secrets.TICKET_PRICE_COLLECTOR_TOKEN }}
          BROWSERLESS_API_TOKEN: ${{ secrets.BROWSERLESS_API_TOKEN }}
          EVENT_URLS: ${{ inputs.event_urls }}
          EVENT_PRICE_COLLECTION_LIMIT: ${{ inputs.price_collection_limit }}
          FORCE_TICKET_PRICE_REFRESH: ${{ inputs.force_price_refresh }}
          TICKET_PRICE_REFRESH_SCOPE: ${{ inputs.pricing_refresh_scope }}
        run: |
          BASE_URL="${SITE_BASE_URL:-https://secretmousetickets.com}"
          if [[ "$BASE_URL" == *".chatgpt.site"* ]]; then
            BASE_URL="https://secretmousetickets.com"
          fi
          if [ -n "${SITE_BYPASS_TOKEN:-}" ]; then
            export OAI_SITES_AUTHORIZATION="Bearer ${SITE_BYPASS_TOKEN}"
          fi
          export SEARCH_PROVIDER_ENDPOINT="${BASE_URL}/api/search/disneyevent"
          export INGEST_ENDPOINT="${BASE_URL}/api/ingest/events"
          npm run ingest:events
